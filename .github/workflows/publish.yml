name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.6.1

      - name: Require release tag to match package version
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            console.error(`Release tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);
            process.exit(1);
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Publish with provenance
        run: npm publish --access public --provenance
